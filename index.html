<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="
    default-src 'self'; 
    script-src 'self'; 
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; 
    font-src https://fonts.gstatic.com;
    ">

    <title>Password Generator</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@500&family=Plus+Jakarta+Sans:wght@400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="assets/css/styles.css">
</head>

<body>

    <div class="container">
        <header>
            <h1>Gerador de Senhas</h1>
            <p>Algoritmo CSPRNG local baseado em entropia matemática</p>
        </header>

        <div class="display-section">
            <span class="password-output" id="passwordDisplay">Clique em 'Gerar Nova Senha'</span>
            <div class="action-buttons">
                <button class="action-btn copy-btn" id="copyBtn" type="button">Copiar</button>
                <button class="action-btn clear-btn" id="clearBtn" type="button">Limpar</button>
            </div>
        </div>

        <div class="control-group">
            <label style="display:block; font-size:13px; font-weight:600; margin-bottom:5px;">
                Comprimento da Senha: <span id="lengthVal">16</span> caracteres
            </label>
            <div class="slider-container">
                <input type="range" id="passLength" min="8" max="64" value="16">
            </div>
        </div>

        <div class="checkbox-grid">
            <div class="checkbox-item"><input type="checkbox" id="chkUpper" checked><label for="chkUpper">Maiúsculas
                    (A-Z)</label></div>
            <div class="checkbox-item"><input type="checkbox" id="chkLower" checked><label for="chkLower">Minúsculas
                    (a-z)</label></div>
            <div class="checkbox-item"><input type="checkbox" id="chkNum" checked><label for="chkNum">Números
                    (0-9)</label></div>
            <div class="checkbox-item"><input type="checkbox" id="chkSym" checked><label for="chkSym">Especiais
                    (!@#$)</label></div>
        </div>

        <button class="generate-btn" id="genBtn" type="button">Gerar Nova Senha</button>

        <div class="entropy-panel" id="entropyPanel">
            <div class="entropy-title">Métricas de Força de Criptoanálise</div>
            <div style="font-size: 15px; font-weight:700;" id="entropyLabel">Entropia: 0 Bits</div>
            <div class="entropy-bar-bg">
                <div class="entropy-bar-fill" id="entropyBar"></div>
            </div>
            <p style="font-size: 12px; color: var(--text-muted);" id="crackTimeLabel">Aguardando geração de senha...</p>
        </div>
    </div>

    <script src="assets/js/script.js" defer></script>
</body>

</html>
