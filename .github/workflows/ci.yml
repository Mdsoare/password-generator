name: Password Generator CI Pipeline

on:
  push:
    branches: ["main", "master"]
  pull_request:
    branches: ["main", "master"]

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  # -------------------------------------------------------------
  # JOB 1: Análise de Código e Segurança (SAST & Secrets)
  # -------------------------------------------------------------
  lint-and-security:
    name: SAST (Linting & Security Scan)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar ambiente Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Instalar Dependências de Desenvolvimento
        run: npm ci

      - name: Scan para detecção de segredos (Secret Detection)
        uses: trufflesecurity/trufflehog@main
        with:
          extra_args: --only-verified

      - name: Validar Sintaxe HTML (HTMLHint)
        run: npx htmlhint index.html

      - name: ESLint Scan
        run: npx eslint assets/js/script.js

  # -------------------------------------------------------------
  # JOB 2: Análise de Dependências (SCA)
  # -------------------------------------------------------------
  sca-osv:
    name: SCA (OSV-Scanner)
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable-pr.yml@v2.5.1

  # -------------------------------------------------------------
  # JOB 3: Validação da Política CSP e Integridade Estrutural
  # -------------------------------------------------------------
  csp-and-structure-check:
    name: Validate CSP & File Integrity
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      # Valida links externos no HTML ignorando as origens permitidas da CSP (Google Fonts)
      - name: Checar se existem dependências externas não autorizadas no HTML
        run: |
          UNAUTHORIZED_LINKS=$(grep -E 'http://|https://' index.html | grep -v 'Content-Security-Policy' | grep -v 'fonts.googleapis.com' | grep -v 'fonts.gstatic.com' || true)
          if [ -n "$UNAUTHORIZED_LINKS" ]; then
            echo "❌ ERRO: Encontrados links/scripts externos não autorizados no index.html:"
            echo "$UNAUTHORIZED_LINKS"
            exit 1
          else
            echo "✅ Validação estática concluída: Somente conexões permitidas pela CSP foram encontradas."
          fi

      - name: Validar estrutura de arquivos obrigatórios
        run: |
          test -f index.html || (echo "❌ index.html não encontrado!" && exit 1)
          test -f assets/js/script.js || (echo "❌ assets/js/script.js não encontrado!" && exit 1)
          test -f assets/css/styles.css || (echo "❌ assets/css/styles.css não encontrado!" && exit 1)
          test -f README.md || (echo "❌ README.md não encontrado!" && exit 1)
          echo "✅ Todos os arquivos essenciais estão presentes."

  # -------------------------------------------------------------
  # JOB 4: Publicação do Artefato
  # -------------------------------------------------------------
  build-artifact:
    name: Bundle & Upload Artifact
    needs: [lint-and-security, sca-osv, csp-and-structure-check]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Empacotar Aplicação
        run: |
          mkdir -p dist/assets
          cp index.html README.md dist/
          cp -r assets/ dist/

      - name: Subir Artefato de Build
        uses: actions/upload-artifact@v4
        with:
          name: password-generator-build
          path: dist/
          retention-days: 7